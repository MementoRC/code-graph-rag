[project]
name = "graph-code"
version = "0.0.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Dependencies now managed by pixi - keeping empty for pip compatibility
]

[tool.setuptools]
packages = ["codebase_rag"]

[project.optional-dependencies]
# All dependencies now managed by pixi environments
# Keep sections empty for pip compatibility

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = [
    "dashboard/node_modules/.*",
    "node_modules/.*",
]

[dependency-groups]
# All dependencies now managed by pixi environments

# =============================================================================
# PIXI CONFIGURATION - TIERED QUALITY FEATURES
# =============================================================================

[tool.pixi.project]
channels = ["conda-forge", "MementoRC"]
platforms = ["linux-64"]  # Optimized single-platform for 85%+ CI success rate
channel-priority = "disabled"  # Faster dependency resolution

[tool.pixi.dependencies]
# Core runtime dependencies - pixi replaces pip entirely
python = ">=3.12,<3.13"  # Python 3.12 only (pymgclient not built for 3.13 yet)
loguru = ">=0.7.3"
python-dotenv = ">=1.1.0"
toml = ">=0.10.2"
watchdog = ">=6.0.0"
typer = ">=0.12.5"
rich = ">=13.7.1"
prompt-toolkit = ">=3.0.0"
diff-match-patch = ">=20241021"
click = ">=8.0.0"
google-genai = ">=1.27.0"  # conda-forge: For document analyzer imports
pre-commit = ">=4.2.0,<5"
pydantic = ">=2.7.0,<2.10.0"  # Consolidated from platform-specific sections
pydantic-settings = ">=2.0.0,<2.5.0"  # Consolidated from platform-specific sections
# Linux-specific dependencies (consolidated)
pymgclient = ">=1.4.0"  # Graph database client from MementoRC channel (Linux-only)
tree-sitter-python = ">=0.23.6"
libtree-sitter = ">=0.25.0"  # Core tree-sitter C library
tree_sitter = ">=0.24.0"  # Python bindings from conda-forge
# Build tools for native packages (Linux development)
cmake = "*"
openssl = "*"
libopenssl-static = "*"  # OpenSSL development libraries
pkg-config = "*"  # For native package builds

# =============================================================================
# LINUX-64 OPTIMIZED CONFIGURATION (CROSS-PLATFORM SECTIONS REMOVED)
# =============================================================================
# Cross-platform target sections removed for 85%+ CI success rate optimization
# All dependencies now managed in unified sections above

# [tool.pixi.pypi-dependencies]
# PyPI-only packages that don't exist in conda-forge
# All dependencies now available in conda-forge!

