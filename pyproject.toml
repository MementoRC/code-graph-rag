[project]
name = "graph-code"
version = "0.0.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Dependencies now managed by pixi - keeping empty for pip compatibility
]

[tool.setuptools]
packages = ["codebase_rag"]

[project.optional-dependencies]
# All dependencies now managed by pixi environments
# Keep sections empty for pip compatibility

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = [
    "dashboard/node_modules/.*",
    "node_modules/.*",
]

[dependency-groups]
# All dependencies now managed by pixi environments

# =============================================================================
# PIXI CONFIGURATION - TIERED QUALITY FEATURES
# =============================================================================

[tool.pixi.project]
channels = ["conda-forge", "MementoRC"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]  # Cross-platform for CI reliability
channel-priority = "disabled"  # Faster dependency resolution

[tool.pixi.dependencies]
# Core runtime dependencies - pixi replaces pip entirely
python = ">=3.12,<3.13"  # Python 3.12 only (pymgclient not built for 3.13 yet)
loguru = ">=0.7.3"
python-dotenv = ">=1.1.0"
toml = ">=0.10.2"
# tree-sitter dependencies moved to platform-specific section below
watchdog = ">=6.0.0"
typer = ">=0.12.5"
rich = ">=13.7.1"
prompt-toolkit = ">=3.0.0"
diff-match-patch = ">=20241021"
click = ">=8.0.0"
google-genai = ">=1.27.0"  # conda-forge: For document analyzer imports
pre-commit = ">=4.3.0,<5"
# pymgclient moved to platform-specific dependencies below
# pydantic and pydantic-settings moved to feature-specific dependencies
# Build tools moved to platform-specific section (not needed for basic cross-platform unit tests)

# Platform-specific dependencies - CRITICAL: pymgclient only available on Linux!
[tool.pixi.target.linux-64.dependencies]
pymgclient = ">=1.4.0"  # Graph database client from MementoRC channel (Linux-only)
tree-sitter-python = ">=0.23.6"
libtree-sitter = ">=0.25.0"  # Core tree-sitter C library
tree_sitter = ">=0.24.0"  # Python bindings from conda-forge
# Build tools for native packages (Linux development)
cmake = "*"
openssl = "*"
libopenssl-static = "*"  # OpenSSL development libraries
pkg-config = "*"  # For native package builds

# NOTE: Cross-platform sections are dynamically added by CI for Windows/macOS testing
# The CI workflow temporarily modifies platforms = ["linux-64"] to specific platforms
# and adds appropriate [tool.pixi.target.{platform}.dependencies] sections as needed

# [tool.pixi.pypi-dependencies]
# PyPI-only packages that don't exist in conda-forge
# All dependencies now available in conda-forge!

# ===== SIMPLIFIED CI ENVIRONMENT =====
# Single environment approach for maximum reliability
[tool.pixi.feature.ci.dependencies]
# Core Testing Framework
pytest = ">=8.4.1"
pytest-cov = ">=4.0.0"
pytest-timeout = ">=2.1.0"
pytest-asyncio = ">=1.0.0"
pytest-xdist = ">=3.3.0"

# Linting & Formatting
ruff = ">=0.5.5"

# Type Checking
mypy = ">=1.11.0"
types-toml = ">=0.10.8.20240310"

# Essential Quality Tools
bandit = ">=1.8.6"
pre-commit = ">=4.2.0"
coverage = ">=7.9.2"

# Runtime dependencies (unified version strategy)
pydantic = ">=2.7.0,<2.15.0"  # Unified version range for compatibility
pydantic-settings = ">=2.0.0,<2.5.0"
pydantic-ai-slim = ">=0.2.14"
python-dotenv = ">=1.1.0"
typer = ">=0.12.5"
rich = ">=13.7.1"
loguru = ">=0.7.3"
google-genai = ">=1.27.0"

# ===== OPTIONAL DEVELOPMENT FEATURES =====
[tool.pixi.feature.dev-extra.dependencies]
# Additional development tools (optional)
memory_profiler = ">=0.61.0"
pytest-benchmark = ">=5.1.0"
python-build = ">=1.2.2"
twine = ">=6.1.0"

[tool.pixi.environments]
# ===== SIMPLIFIED ENVIRONMENT STRATEGY =====
# Single primary environment for maximum reliability
default = {solve-group = "default"}

# Single CI environment (replaces ci-smoke, ci, quality)
ci = {features = ["ci"], solve-group = "default"}

# Optional development environment with extra tools
dev = {features = ["ci", "dev-extra"], solve-group = "default"}

[tool.pixi.tasks]
# ===== TIER 1: CORE DEVELOPMENT TASKS (ESSENTIAL) =====
# Installation & Setup
install-editable = "pip install -e ."
dev-setup = "echo 'Development environment ready'"

# Testing (SIMPLIFIED APPROACH) - with Claude Code git bypass
# All test tasks now explicitly specify CI environment for proper dependency access
test = "pixi run -e ci pytest codebase_rag/tests/ -v --timeout=60"
test-cov = "pixi run -e ci pytest codebase_rag/tests/ --cov=codebase_rag --cov-report=term-missing --cov-report=xml --timeout=60"
test-unit = "pixi run -e ci pytest codebase_rag/tests/test_*.py -v --timeout=30"
test-integration = "pixi run -e ci pytest codebase_rag/tests/test_*_integration.py -v --timeout=120"

# Smoke testing (cross-platform compatible)
test-smoke = "pixi run -e ci pytest codebase_rag/tests/test_main_smoke.py -v --timeout=30"

# Quality Gates (CRITICAL - MUST PASS) - PREVENT CI FAILURES
# All quality tasks explicitly specify CI environment for dependency access
lint = "pixi run -e ci ruff check codebase_rag/ --select=F,E9"
lint-fix = "pixi run -e ci ruff check --fix codebase_rag/"    # 🚨 ESSENTIAL: Auto-fix lint violations
format = "pixi run -e ci ruff format codebase_rag/"           # 🚨 ESSENTIAL: Format code
format-check = "pixi run -e ci ruff format --check codebase_rag/"
format-diff = "pixi run -e ci ruff format --diff codebase_rag/"
typecheck = "pixi run -e ci mypy codebase_rag/"

# Combined Quality Check - 🚨 MANDATORY BEFORE COMMIT
quality = { depends-on = ["test-smoke", "lint", "format-check", "typecheck"] }   # Unified quality check

# Pre-commit Integration - PREVENT CI FAILURES
# Pre-commit tasks explicitly specify CI environment for dependency access
pre-commit = "pixi run -e ci pre-commit run --all-files"
install-pre-commit = "pixi run -e ci pre-commit install --install-hooks"

# Emergency Quality Fix - USE FOR "Found X errors" CI FAILURES
# Emergency fix uses CI environment for all dependency access
emergency-fix = "pixi run -e ci ruff check --fix codebase_rag/ && pixi run -e ci ruff format codebase_rag/ && pixi run -e ci pytest codebase_rag/tests/ -v"

# ===== TIER 2: SECURITY & COMPLIANCE TASKS =====
# Security Scanning with JSON report generation - explicitly use CI environment
security-scan = "pixi run -e ci bandit -r codebase_rag/ --severity-level high -f json -o bandit-report.json || echo 'Bandit scan complete'"
safety-check = "pixi run -e ci safety check --json > safety-report.json || echo 'Safety scan complete'"  # Use legacy command to avoid auth issues

# Static Analysis Suite
static-analysis = { depends-on = ["security-scan"] }  # safety-check runs in separate environment

# Comprehensive Check
check-all = { depends-on = ["quality", "static-analysis"] }

# ===== TIER 3: CI/CD & DEPLOYMENT TASKS =====
# CI-specific variants - simplified and reliable
ci-test = { cmd = "pytest codebase_rag/tests/test_main_smoke.py --cov=codebase_rag --cov-report=xml --timeout=90 -v", env = { CLAUDECODE = "0", ENVIRONMENT = "ci" } }
ci-lint = "ruff check codebase_rag/ --output-format=github --select=F,E9"
ci-format-check = "ruff format --check codebase_rag/"
ci-quality = { depends-on = ["ci-test", "ci-lint", "ci-format-check", "typecheck"] }

# Build & Deploy
build = "python -m build"
clean = "rm -rf __pycache__ .pytest_cache .coverage htmlcov .ruff_cache dist build .mypy_cache"

# ===== PROJECT-SPECIFIC TASKS =====
# Graph-Code specific tasks (require pymgclient)
install-pymgclient = "echo 'pymgclient is automatically installed via PIXI dependencies from MementoRC channel'"
serve = { depends-on = ["install-pymgclient"], cmd = "python -m codebase_rag.main start --repo-path ." }
parse-repo = { depends-on = ["install-pymgclient"], cmd = "python -m codebase_rag.main start --repo-path . --update-graph --clean" }
export-graph = { depends-on = ["install-pymgclient"], cmd = "python -m codebase_rag.main export -o graph_export.json" }
optimize-python = { depends-on = ["install-pymgclient"], cmd = "python -m codebase_rag.main optimize python --repo-path ." }

# Docker tasks
docker-up = "docker-compose up -d"
docker-down = "docker-compose down"
docker-logs = "docker-compose logs memgraph"

# Language support tasks
list-languages = "python -m codebase_rag.tools.language list-languages"
add-language = "python -m codebase_rag.tools.language add-grammar"

# Development utilities
build-binary = "python build_binary.py"
run-example = "python examples/graph_export_example.py"

# ===== CI-SPECIFIC TASKS =====
# Enhanced CI task variants
diff-cover = "diff-cover coverage.xml --compare-branch=origin/main --html-report diff-coverage.html --json-report diff-coverage.json"
safety-check-ci = "safety check --json --output safety-report.json"

# Comprehensive quality validation
quality-gate = { depends-on = ["test", "lint", "format-check", "typecheck", "security-scan"] }

# ===== LEGACY/SPECIALIZED TASKS =====
# Keep existing specialized tasks
benchmark = "pytest codebase_rag/tests/ -m benchmark --benchmark-only --benchmark-sort=mean --benchmark-json=benchmark-results.json"
test-coverage = "pytest codebase_rag/tests/ --cov=codebase_rag --cov-branch --cov-report=html --cov-report=xml --cov-report=json --cov-report=term-missing"
