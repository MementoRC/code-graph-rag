name: Build and Deploy Dashboard

on:
  push:
    branches: [ main, feat-upstream-analysis-strategy ]
    paths:
      - 'dashboard/**'
      - 'docs/upstream-analysis/**'
      - '.github/workflows/dashboard-deploy.yml'
  schedule:
    # Rebuild dashboard daily at 6 AM UTC to refresh data
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force complete rebuild'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🛒 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for git statistics
        
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: dashboard/package-lock.json
        
    - name: 📦 Install dependencies
      working-directory: dashboard
      run: |
        npm ci
        
    - name: 🗃️ Collect dashboard data
      working-directory: dashboard
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "🚀 Starting data collection..."
        npm run build:data
        echo "✅ Data collection completed"
        
        # Log data collection summary
        if [ -f "src/_data/collection-summary.json" ]; then
          echo "📊 Data Collection Summary:"
          cat src/_data/collection-summary.json | jq '.'
        fi
        
    - name: 🏗️ Build dashboard
      working-directory: dashboard
      run: |
        echo "🏗️ Building static dashboard..."
        npm run build
        echo "✅ Dashboard build completed"
        
        # List generated files
        echo "📁 Generated files:"
        find _site -type f -name "*.html" | head -10
        
    - name: 📤 Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: dashboard/_site
        
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: 🚀 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      
    - name: 📊 Deployment Summary
      run: |
        echo "## 🎉 Dashboard Deployment Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Dashboard URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
        echo "**Deployment Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ github.event_name }}" = "schedule" ]; then
          echo "**Type:** Automated daily rebuild" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "**Type:** Manual deployment" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            echo "**Mode:** Force rebuild enabled" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "**Type:** Code change deployment" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📈 Dashboard Features" >> $GITHUB_STEP_SUMMARY
        echo "- **Upstream Activity Monitoring:** Real-time tracking of upstream repository changes" >> $GITHUB_STEP_SUMMARY
        echo "- **Analysis Session History:** Complete record of team analysis sessions" >> $GITHUB_STEP_SUMMARY
        echo "- **Extraction Status:** Progress tracking for feature extractions" >> $GITHUB_STEP_SUMMARY
        echo "- **Team Participation Metrics:** Contributor activity and engagement" >> $GITHUB_STEP_SUMMARY
        echo "- **Interactive Visualizations:** Charts and graphs powered by Chart.js" >> $GITHUB_STEP_SUMMARY
        echo "- **Mobile Responsive:** Optimized for all device sizes" >> $GITHUB_STEP_SUMMARY