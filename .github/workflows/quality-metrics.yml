name: Quality Metrics

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    # Run daily at 6 AM UTC for trend analysis
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: 1
  PIXI_VERSION: v0.50.2
  ENVIRONMENT: ci
  CLAUDECODE: 0

jobs:
  coverage-analysis:
    name: "📊 Coverage Analysis"
    runs-on: ubuntu-latest
    services:
      memgraph:
        image: memgraph/memgraph:2.18.1
        ports:
          - 7687:7687
        options: >-
          --health-cmd "timeout 5s bash -c '</dev/tcp/127.0.0.1/7687' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for coverage comparison

      - name: Install pixi
        run: |
          echo "🚀 Installing pixi for quality metrics"
          curl -fsSL https://pixi.sh/install.sh | bash -s -- --version ${{ env.PIXI_VERSION }}
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH
          pixi --version

      - name: Install quality analysis dependencies
        run: |
          echo "📊 Installing quality analysis dependencies"
          if pixi install -e ci; then
            echo "✅ Quality analysis dependencies installed successfully"
          else
            echo "🚨 CRITICAL: Failed to install quality analysis dependencies"
            exit 1
          fi

      - name: Run comprehensive test coverage
        run: |
          echo "📊 Running comprehensive coverage analysis"
          pixi run -e ci test-smoke || echo '⚠️ Coverage collection requires pymgclient - this is expected'
        env:
          MEMGRAPH_HOST: localhost
          MEMGRAPH_PORT: 7687

      - name: Generate coverage reports (multiple formats)
        run: |
          echo "📄 Generating coverage reports in multiple formats"
          # Already generated by test-coverage task, but ensure all formats
          if [ -f .coverage ]; then
            pixi run -e dev python -c "
            import coverage
            cov = coverage.Coverage()
            cov.load()
            cov.html_report(directory='htmlcov')
            cov.xml_report(outfile='coverage.xml')
            cov.json_report(outfile='coverage.json')
            print('Coverage reports generated successfully')
            "
          fi

      - name: Calculate differential coverage (PR only)
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Calculating differential coverage for PR"
          # Use diff-cover from quality environment (already available in conda-forge)
          pixi run -e ci diff-cover --version || echo "diff-cover not yet in environment"

          # Generate diff coverage report
          if [ -f coverage.xml ]; then
            pixi run -e ci diff-cover coverage.xml --compare-branch=origin/${{ github.event.pull_request.base.ref }} \
              --html-report diff-coverage.html \
              --json-report diff-coverage.json || echo "Diff coverage calculated"
          fi

      - name: Extract coverage metrics
        id: coverage
        run: |
          if [ -f coverage.json ]; then
            # Extract metrics from coverage.json
            TOTAL_COVERAGE=$(python -c "
            import json
            with open('coverage.json') as f:
                data = json.load(f)
            print(f\"{data['totals']['percent_covered']:.1f}\")
            " 2>/dev/null || echo "0.0")

            TOTAL_STATEMENTS=$(python -c "
            import json
            with open('coverage.json') as f:
                data = json.load(f)
            print(data['totals']['num_statements'])
            " 2>/dev/null || echo "0")

            COVERED_STATEMENTS=$(python -c "
            import json
            with open('coverage.json') as f:
                data = json.load(f)
            print(data['totals']['covered_lines'])
            " 2>/dev/null || echo "0")

            echo "total_coverage=$TOTAL_COVERAGE" >> $GITHUB_OUTPUT
            echo "total_statements=$TOTAL_STATEMENTS" >> $GITHUB_OUTPUT
            echo "covered_statements=$COVERED_STATEMENTS" >> $GITHUB_OUTPUT
          else
            echo "total_coverage=0.0" >> $GITHUB_OUTPUT
            echo "total_statements=0" >> $GITHUB_OUTPUT
            echo "covered_statements=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage.xml
            coverage.json
            htmlcov/
            diff-coverage.html
            diff-coverage.json
            .coverage
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.total_coverage }}';
            const statements = '${{ steps.coverage.outputs.total_statements }}';
            const covered = '${{ steps.coverage.outputs.covered_statements }}';

            const coverageEmoji = coverage >= 90 ? '🟢' : coverage >= 70 ? '🟡' : '🔴';

            const body = `## 📊 Coverage Report

            ${coverageEmoji} **Total Coverage: ${coverage}%**

            | Metric | Value |
            |--------|-------|
            | Total Statements | ${statements} |
            | Covered Statements | ${covered} |
            | Coverage Percentage | ${coverage}% |

            ### Coverage Status
            ${coverage >= 90 ? '✅ Excellent coverage!' :
              coverage >= 70 ? '⚠️ Good coverage, consider improving' :
              '❌ Low coverage, please add tests'}

            [View detailed coverage report in artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            // Find existing coverage comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.data.find(comment =>
              comment.body.includes('## 📊 Coverage Report')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Generate coverage summary
        if: always()
        run: |
          echo "## 📊 Coverage Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Coverage | ${{ steps.coverage.outputs.total_coverage }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Statements | ${{ steps.coverage.outputs.total_statements }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Covered Statements | ${{ steps.coverage.outputs.covered_statements }} |" >> $GITHUB_STEP_SUMMARY

          # Coverage status
          COVERAGE="${{ steps.coverage.outputs.total_coverage }}"
          if [ $(echo "$COVERAGE >= 90" | bc -l) -eq 1 ]; then
            echo "| Status | 🟢 Excellent |" >> $GITHUB_STEP_SUMMARY
          elif [ $(echo "$COVERAGE >= 70" | bc -l) -eq 1 ]; then
            echo "| Status | 🟡 Good |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | 🔴 Needs Improvement |" >> $GITHUB_STEP_SUMMARY
          fi

  code-quality-metrics:
    name: "📏 Code Quality Metrics"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pixi
        run: |
          echo "🚀 Installing pixi for code quality"
          curl -fsSL https://pixi.sh/install.sh | bash -s -- --version ${{ env.PIXI_VERSION }}
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH
          pixi --version

      - name: Install code quality tools
        run: |
          echo "📏 Installing code quality tools"
          if pixi install -e ci; then
            echo "✅ Code quality tools installed successfully"
          else
            echo "🚨 CRITICAL: Failed to install code quality tools"
            exit 1
          fi

      - name: Run comprehensive linting
        run: |
          echo "📏 Running comprehensive code quality analysis"
          # Full ruff check (not just F,E9)
          pixi run -e ci ruff check codebase_rag/ --output-format=json > ruff-report.json || echo "Ruff analysis complete"

      - name: Run type checking with detailed output
        run: |
          echo "📝 Running detailed type analysis"
          pixi run -e ci mypy codebase_rag/ --json-report mypy-report.json || echo "MyPy analysis complete"

      - name: Analyze code complexity
        run: |
          echo "🔍 Analyzing code complexity"
          # Use complexity analysis tools from quality environment
          pixi run -e ci radon --version || echo "radon not yet in environment"
          pixi run -e ci xenon --version || echo "xenon not yet in environment"

          # Generate complexity reports using pixi
          pixi run -e ci radon cc codebase_rag/ --json > complexity-report.json || echo "Complexity analysis complete"
          pixi run -e ci radon mi codebase_rag/ --json > maintainability-report.json || echo "Maintainability analysis complete"

      - name: Generate quality metrics summary
        run: |
          echo "📊 Generating quality metrics summary"
          python << 'EOF'
          import json
          import os

          # Initialize metrics
          metrics = {
              "total_files": 0,
              "total_lines": 0,
              "ruff_issues": 0,
              "mypy_issues": 0,
              "complexity_grade": "Unknown"
          }

          # Count Python files and lines
          for root, dirs, files in os.walk("codebase_rag"):
              for file in files:
                  if file.endswith(".py"):
                      metrics["total_files"] += 1
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, 'r', encoding='utf-8') as f:
                              metrics["total_lines"] += sum(1 for line in f if line.strip())
                      except:
                          pass

          # Parse ruff report
          try:
              with open("ruff-report.json", 'r') as f:
                  ruff_data = json.load(f)
                  metrics["ruff_issues"] = len(ruff_data)
          except:
              pass

          # Parse mypy report
          try:
              with open("mypy-report.json", 'r') as f:
                  mypy_data = json.load(f)
                  metrics["mypy_issues"] = len([m for m in mypy_data if m.get("level") == "error"])
          except:
              pass

          # Save metrics
          with open("quality-metrics.json", 'w') as f:
              json.dump(metrics, f, indent=2)

          print("Quality metrics generated")
          EOF

      - name: Upload quality reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-metrics
          path: |
            ruff-report.json
            mypy-report.json
            complexity-report.json
            maintainability-report.json
            quality-metrics.json
          retention-days: 30

      - name: Generate quality summary
        if: always()
        run: |
          echo "## 📏 Code Quality Metrics" >> $GITHUB_STEP_SUMMARY

          if [ -f quality-metrics.json ]; then
            # Extract metrics from JSON
            TOTAL_FILES=$(python -c "import json; print(json.load(open('quality-metrics.json'))['total_files'])" 2>/dev/null || echo "0")
            TOTAL_LINES=$(python -c "import json; print(json.load(open('quality-metrics.json'))['total_lines'])" 2>/dev/null || echo "0")
            RUFF_ISSUES=$(python -c "import json; print(json.load(open('quality-metrics.json'))['ruff_issues'])" 2>/dev/null || echo "0")
            MYPY_ISSUES=$(python -c "import json; print(json.load(open('quality-metrics.json'))['mypy_issues'])" 2>/dev/null || echo "0")

            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Python Files | $TOTAL_FILES |" >> $GITHUB_STEP_SUMMARY
            echo "| Lines of Code | $TOTAL_LINES |" >> $GITHUB_STEP_SUMMARY
            echo "| Ruff Issues | $RUFF_ISSUES |" >> $GITHUB_STEP_SUMMARY
            echo "| MyPy Issues | $MYPY_ISSUES |" >> $GITHUB_STEP_SUMMARY

            # Quality assessment
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Quality Assessment" >> $GITHUB_STEP_SUMMARY
            if [ "$RUFF_ISSUES" -eq 0 ] && [ "$MYPY_ISSUES" -eq 0 ]; then
              echo "✅ **Excellent** - No linting or type issues" >> $GITHUB_STEP_SUMMARY
            elif [ "$RUFF_ISSUES" -lt 10 ] && [ "$MYPY_ISSUES" -lt 5 ]; then
              echo "🟡 **Good** - Minor issues to address" >> $GITHUB_STEP_SUMMARY
            else
              echo "🔴 **Needs Improvement** - Multiple issues to resolve" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  security-metrics:
    name: "🔒 Security Metrics"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Robust pixi installation for security metrics
        run: |
          echo "🚀 Installing pixi for security metrics analysis"
          
          # Install pixi with verification
          curl -fsSL https://pixi.sh/install.sh | bash -s -- --version ${{ env.PIXI_VERSION }}
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH
          export PATH="$HOME/.pixi/bin:$PATH"
          
          # Verify installation
          if command -v pixi >/dev/null 2>&1; then
            echo "✅ pixi installed successfully: $(pixi --version)"
          else
            echo "🚨 CRITICAL: pixi installation failed"
            exit 1
          fi

      - name: Install security analysis tools
        run: |
          echo "🔒 Installing security analysis tools"
          if pixi install -e ci; then
            echo "✅ Security analysis tools installed successfully"
          else
            echo "🚨 CRITICAL: Failed to install security analysis tools"
            exit 1
          fi

      - name: Run comprehensive security analysis
        run: |
          echo "🔒 Running comprehensive security analysis"

          # Bandit security scan with JSON output
          pixi run -e ci bandit -r codebase_rag/ -f json -o bandit-report.json || echo "Bandit scan complete"

          # Safety vulnerability scan
          pixi run -e ci safety check --json --output safety-report.json || echo "Safety scan complete"

      - name: Analyze security metrics
        run: |
          echo "📊 Analyzing security metrics"
          python << 'EOF'
          import json

          security_metrics = {
              "bandit_issues": {"high": 0, "medium": 0, "low": 0},
              "safety_vulnerabilities": 0,
              "security_score": 100
          }

          # Parse Bandit report
          try:
              with open("bandit-report.json", 'r') as f:
                  bandit_data = json.load(f)
                  for result in bandit_data.get("results", []):
                      severity = result.get("issue_severity", "").lower()
                      if severity in security_metrics["bandit_issues"]:
                          security_metrics["bandit_issues"][severity] += 1
          except:
              pass

          # Parse Safety report
          try:
              with open("safety-report.json", 'r') as f:
                  safety_data = json.load(f)
                  security_metrics["safety_vulnerabilities"] = len(safety_data.get("vulnerabilities", []))
          except:
              pass

          # Calculate security score
          high_issues = security_metrics["bandit_issues"]["high"]
          medium_issues = security_metrics["bandit_issues"]["medium"]
          vulnerabilities = security_metrics["safety_vulnerabilities"]

          score = 100 - (high_issues * 20) - (medium_issues * 10) - (vulnerabilities * 15)
          security_metrics["security_score"] = max(0, score)

          # Save metrics
          with open("security-metrics.json", 'w') as f:
              json.dump(security_metrics, f, indent=2)

          print("Security metrics generated")
          EOF

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-metrics
          path: |
            bandit-report.json
            safety-report.json
            security-metrics.json
          retention-days: 30

      - name: Generate security summary
        if: always()
        run: |
          echo "## 🔒 Security Analysis Results" >> $GITHUB_STEP_SUMMARY

          if [ -f security-metrics.json ]; then
            # Extract security metrics
            HIGH_ISSUES=$(python -c "import json; print(json.load(open('security-metrics.json'))['bandit_issues']['high'])" 2>/dev/null || echo "0")
            MEDIUM_ISSUES=$(python -c "import json; print(json.load(open('security-metrics.json'))['bandit_issues']['medium'])" 2>/dev/null || echo "0")
            LOW_ISSUES=$(python -c "import json; print(json.load(open('security-metrics.json'))['bandit_issues']['low'])" 2>/dev/null || echo "0")
            VULNERABILITIES=$(python -c "import json; print(json.load(open('security-metrics.json'))['safety_vulnerabilities'])" 2>/dev/null || echo "0")
            SECURITY_SCORE=$(python -c "import json; print(json.load(open('security-metrics.json'))['security_score'])" 2>/dev/null || echo "0")

            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| High Severity Issues | $HIGH_ISSUES |" >> $GITHUB_STEP_SUMMARY
            echo "| Medium Severity Issues | $MEDIUM_ISSUES |" >> $GITHUB_STEP_SUMMARY
            echo "| Low Severity Issues | $LOW_ISSUES |" >> $GITHUB_STEP_SUMMARY
            echo "| Known Vulnerabilities | $VULNERABILITIES |" >> $GITHUB_STEP_SUMMARY
            echo "| Security Score | $SECURITY_SCORE/100 |" >> $GITHUB_STEP_SUMMARY

            # Security assessment
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Security Assessment" >> $GITHUB_STEP_SUMMARY
            if [ "$HIGH_ISSUES" -eq 0 ] && [ "$VULNERABILITIES" -eq 0 ]; then
              echo "✅ **Secure** - No high-severity issues or known vulnerabilities" >> $GITHUB_STEP_SUMMARY
            elif [ "$HIGH_ISSUES" -eq 0 ] && [ "$VULNERABILITIES" -lt 3 ]; then
              echo "🟡 **Good** - Minor security considerations" >> $GITHUB_STEP_SUMMARY
            else
              echo "🔴 **Attention Needed** - Address security issues" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  metrics-summary:
    name: "📈 Quality Dashboard"
    runs-on: ubuntu-latest
    needs: [coverage-analysis, code-quality-metrics, security-metrics]
    if: always()
    steps:
      - name: Download all metric artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-metrics

      - name: Generate comprehensive quality dashboard
        run: |
          echo "# 📈 Project Quality Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall health indicator
          echo "## 🎯 Overall Project Health" >> $GITHUB_STEP_SUMMARY

          # Create health score based on job results
          COVERAGE_STATUS="${{ needs.coverage-analysis.result }}"
          QUALITY_STATUS="${{ needs.code-quality-metrics.result }}"
          SECURITY_STATUS="${{ needs.security-metrics.result }}"

          HEALTH_SCORE=0
          if [ "$COVERAGE_STATUS" = "success" ]; then HEALTH_SCORE=$((HEALTH_SCORE + 33)); fi
          if [ "$QUALITY_STATUS" = "success" ]; then HEALTH_SCORE=$((HEALTH_SCORE + 33)); fi
          if [ "$SECURITY_STATUS" = "success" ]; then HEALTH_SCORE=$((HEALTH_SCORE + 34)); fi

          if [ $HEALTH_SCORE -ge 90 ]; then
            echo "🟢 **Excellent** ($HEALTH_SCORE/100) - Project is in great shape!" >> $GITHUB_STEP_SUMMARY
          elif [ $HEALTH_SCORE -ge 70 ]; then
            echo "🟡 **Good** ($HEALTH_SCORE/100) - Minor improvements needed" >> $GITHUB_STEP_SUMMARY
          else
            echo "🔴 **Needs Attention** ($HEALTH_SCORE/100) - Several issues to address" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Quality Metrics Overview" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ needs.coverage-analysis.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Test coverage analysis |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality-metrics.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Linting and complexity |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-metrics.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Vulnerability scanning |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Available Reports" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 [Coverage Reports](../actions/runs/${{ github.run_id }}) - HTML, XML, JSON formats" >> $GITHUB_STEP_SUMMARY
          echo "- 📏 [Code Quality Metrics](../actions/runs/${{ github.run_id }}) - Linting and complexity analysis" >> $GITHUB_STEP_SUMMARY
          echo "- 🔒 [Security Analysis](../actions/runs/${{ github.run_id }}) - Vulnerability and security scanning" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🎯 Recommendations" >> $GITHUB_STEP_SUMMARY
          if [ "$COVERAGE_STATUS" != "success" ]; then
            echo "- 📊 Improve test coverage and fix failing tests" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$QUALITY_STATUS" != "success" ]; then
            echo "- 📏 Address code quality issues identified by linting tools" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$SECURITY_STATUS" != "success" ]; then
            echo "- 🔒 Review and fix security vulnerabilities" >> $GITHUB_STEP_SUMMARY
          fi
          if [ $HEALTH_SCORE -ge 90 ]; then
            echo "- 🎉 Great work! Maintain current quality standards" >> $GITHUB_STEP_SUMMARY
          fi
