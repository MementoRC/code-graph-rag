name: CI/CD Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: 1
  PIXI_VERSION: v0.49.0
  ENVIRONMENT: ci
  CLAUDECODE: 0

jobs:
  changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.changes.outputs.python }}
      tests: ${{ steps.changes.outputs.tests }}
      docs: ${{ steps.changes.outputs.docs }}
      ci: ${{ steps.changes.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            python:
              - 'codebase_rag/**/*.py'
              - 'pyproject.toml'
              - 'pixi.lock'
            tests:
              - 'codebase_rag/tests/**'
              - 'pytest.ini'
            docs:
              - 'docs/**'
              - 'README.md'
              - '*.md'
            ci:
              - '.github/workflows/**'
              - 'pyproject.toml'

  quality-gates:
    name: "🚨 Quality Gates (Zero-Tolerance)"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pixi (primary method)
        id: setup-pixi
        continue-on-error: true
        uses: prefix-dev/setup-pixi@v0.8.11
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          manifest-path: pyproject.toml

      - name: Manual pixi installation (failover)
        if: steps.setup-pixi.outcome == 'failure'
        run: |
          echo "⚠️ setup-pixi action failed, falling back to manual installation"
          curl -fsSL https://pixi.sh/install.sh | bash -s -- --version ${{ env.PIXI_VERSION }}
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pixi install -e ci

      - name: Run essential quality gates
        run: |
          echo "🚨 Running Zero-Tolerance Quality Gates"
          pixi run -e ci quality

      - name: Check code formatting
        run: pixi run -e ci format-check

      - name: Generate quality report
        if: always()
        run: |
          echo "## 🚨 Quality Gates Report" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          if pixi run -e ci lint --quiet; then
            echo "| Lint (F,E9) | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Lint (F,E9) | ❌ FAIL |" >> $GITHUB_STEP_SUMMARY
          fi
          if pixi run -e ci typecheck --quiet; then
            echo "| Type Check | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Type Check | ❌ FAIL |" >> $GITHUB_STEP_SUMMARY
          fi

  comprehensive-testing:
    name: "🧪 Comprehensive Testing"
    runs-on: ubuntu-latest
    needs: [changes, quality-gates]
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.tests == 'true'
    services:
      memgraph:
        image: memgraph/memgraph:latest
        ports:
          - 7687:7687
        options: >-
          --health-cmd "nc -z 127.0.0.1 7687 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.11
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          manifest-path: pyproject.toml

      - name: Install dependencies
        run: pixi install -e ci-smoke

      - name: Run comprehensive tests
        run: |
          echo "🧪 Running comprehensive test suite"
          pixi run -e ci-smoke test-cov
        env:
          MEMGRAPH_HOST: localhost
          MEMGRAPH_PORT: 7687

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
            .coverage

      - name: Generate test summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.xml ]; then
            # Extract coverage percentage from XML
            COVERAGE=$(python -c "
            import xml.etree.ElementTree as ET
            tree = ET.parse('coverage.xml')
            root = tree.getroot()
            print(f\"{float(root.attrib['line-rate']) * 100:.1f}%\")
            " 2>/dev/null || echo "N/A")
            echo "**Coverage:** $COVERAGE" >> $GITHUB_STEP_SUMMARY
          fi

  security-compliance:
    name: "🔒 Security & Compliance"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.11
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          manifest-path: pyproject.toml

      - name: Install security tools
        run: pixi install -e security

      - name: Run security scanning
        run: |
          echo "🔒 Running security analysis"
          pixi run -e security security-scan

      - name: Run vulnerability scanning (isolated environment)
        run: |
          echo "🔍 Scanning for vulnerabilities"
          pixi run -e security safety-check || echo "⚠️ Safety scan completed with warnings"

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  performance-testing:
    name: "⚡ Performance Testing"
    runs-on: ubuntu-latest
    needs: [changes, quality-gates]
    if: needs.changes.outputs.python == 'true'
    services:
      memgraph:
        image: memgraph/memgraph:latest
        ports:
          - 7687:7687
        options: >-
          --health-cmd "nc -z 127.0.0.1 7687 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.11
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          manifest-path: pyproject.toml

      - name: Install dependencies
        run: pixi install -e dev

      - name: Run performance benchmarks
        run: |
          echo "⚡ Running performance benchmarks"
          pixi run benchmark || echo "⚠️ Benchmarks completed with some variations"
        env:
          MEMGRAPH_HOST: localhost
          MEMGRAPH_PORT: 7687

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            .benchmarks/
            benchmark-*.json

  cross-platform:
    name: "🌍 Cross-Platform Validation"
    runs-on: ${{ matrix.os }}
    needs: [changes, quality-gates]
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
          - os: windows-latest
            platform: win-64
          - os: macos-latest
            platform: osx-64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.11
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          manifest-path: pyproject.toml

      - name: Install dependencies with platform flag
        run: pixi install -e ci-smoke --platform ${{ matrix.platform }}

      - name: Run basic tests
        run: pixi run -e ci-smoke --platform ${{ matrix.platform }} test-unit

  deploy-artifacts:
    name: "📦 Deploy Artifacts"
    runs-on: ubuntu-latest
    needs: [quality-gates, comprehensive-testing, security-compliance]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.11
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          manifest-path: pyproject.toml

      - name: Install build tools
        run: pixi install -e quality-full

      - name: Build package
        run: pixi run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/

  status-summary:
    name: "📊 Pipeline Status"
    runs-on: ubuntu-latest
    needs: [quality-gates, comprehensive-testing, security-compliance, performance-testing, cross-platform]
    if: always()
    steps:
      - name: Generate pipeline summary
        run: |
          echo "# 🚀 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status Overview" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gates | ${{ needs.quality-gates.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Testing | ${{ needs.comprehensive-testing.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-compliance.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.performance-testing.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cross-Platform | ${{ needs.cross-platform.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🎯 Next Steps" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.quality-gates.result }}" != "success" ]]; then
            echo "- ❌ **CRITICAL**: Fix quality gate failures before proceeding" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "${{ needs.comprehensive-testing.result }}" != "success" ]]; then
            echo "- 🧪 Review test failures and fix failing test cases" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "${{ needs.security-compliance.result }}" != "success" ]]; then
            echo "- 🔒 Address security vulnerabilities identified in scan" >> $GITHUB_STEP_SUMMARY
          fi