---
name: Analysis Session Automation

on:
  schedule:
    # Weekly on Mondays at 09:00 UTC (adjust for team timezone)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # Allow manual triggering for ad-hoc sessions
    inputs:
      session_type:
        description: 'Type of analysis session'
        required: false
        default: 'regular'
        type: choice
        options:
          - regular
          - ad-hoc
          - urgent
      participants:
        description: 'Session participants (comma-separated emails)'
        required: false
        default: ''
        type: string
      focus_area:
        description: 'Specific focus area for this session'
        required: false
        default: 'general'
        type: string
      duration_minutes:
        description: 'Expected session duration in minutes'
        required: false
        default: '60'
        type: string

env:
  NODE_VERSION: '18'
  SESSION_BRANCH_PREFIX: 'analysis'
  DEFAULT_PARTICIPANTS: 'team@example.com'  # Configure with actual team emails

jobs:
  prepare-session:
    name: "🎯 Prepare Analysis Session"
    runs-on: ubuntu-latest
    
    outputs:
      session_id: ${{ steps.session-info.outputs.session_id }}
      session_date: ${{ steps.session-info.outputs.session_date }}
      branch_name: ${{ steps.session-info.outputs.branch_name }}
      participants: ${{ steps.session-info.outputs.participants }}
      session_type: ${{ steps.session-info.outputs.session_type }}
      focus_area: ${{ steps.session-info.outputs.focus_area }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
      commit_count: ${{ steps.changes.outputs.commit_count }}
      last_session_date: ${{ steps.changes.outputs.last_session_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name 'analysis-bot[bot]'
          git config --global user.email \
            'analysis-bot[bot]@users.noreply.github.com'

      - name: Generate session information
        id: session-info
        run: |
          # Generate unique session ID
          session_date=$(date -u '+%Y-%m-%d')
          session_time=$(date -u '+%H%M')
          session_id="session-${session_date}-${session_time}"
          
          # Determine session type
          if [ "${{ github.event_name }}" = "schedule" ]; then
            session_type="regular"
          else
            session_type="${{ inputs.session_type || 'ad-hoc' }}"
          fi
          
          # Generate branch name
          branch_name="${SESSION_BRANCH_PREFIX}/${session_date}-${session_type}"
          
          # Determine participants
          if [ "${{ inputs.participants }}" != "" ]; then
            participants="${{ inputs.participants }}"
          else
            participants="${DEFAULT_PARTICIPANTS}"
          fi
          
          # Set focus area
          focus_area="${{ inputs.focus_area || 'general' }}"
          
          echo "session_id=$session_id" >> $GITHUB_OUTPUT
          echo "session_date=$session_date" >> $GITHUB_OUTPUT
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "participants=$participants" >> $GITHUB_OUTPUT
          echo "session_type=$session_type" >> $GITHUB_OUTPUT
          echo "focus_area=$focus_area" >> $GITHUB_OUTPUT
          
          echo "🎯 Session Information:"
          echo "- Session ID: $session_id"
          echo "- Date: $session_date"
          echo "- Type: $session_type"
          echo "- Branch: $branch_name"
          echo "- Focus: $focus_area"

      - name: Add upstream remote
        run: |
          echo "🔗 Adding upstream remote..."
          git remote add upstream \
            https://github.com/vitali87/code-graph-rag.git || true
          git fetch upstream

      - name: Determine changes since last session
        id: changes
        run: |
          echo "🔍 Analyzing changes since last session..."
          
          # Find last analysis session
          last_analysis_branch=$(git branch -r --list "origin/analysis/*" | \
            sort -V | tail -1 | sed 's/.*origin\///')
          
          if [ -n "$last_analysis_branch" ]; then
            last_session_commit=$(git rev-parse "origin/$last_analysis_branch")
            last_session_date=$(echo "$last_analysis_branch" | \
              sed 's/analysis\/\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\).*/\1/')
            echo "📅 Last session: $last_session_date ($last_analysis_branch)"
            echo "📍 Last session commit: $last_session_commit"
            
            # Compare with current upstream
            current_upstream=$(git rev-parse upstream/main)
            echo "📍 Current upstream: $current_upstream"
            
            if [ "$last_session_commit" != "$current_upstream" ]; then
              commit_count=$(git rev-list --count \
                $last_session_commit..upstream/main 2>/dev/null || echo "unknown")
              echo "✅ Changes detected: $commit_count new commits"
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "commit_count=$commit_count" >> $GITHUB_OUTPUT
            else
              echo "ℹ️ No changes since last session"
              echo "has_changes=false" >> $GITHUB_OUTPUT
              echo "commit_count=0" >> $GITHUB_OUTPUT
            fi
          else
            echo "🆕 No previous analysis sessions found"
            commit_count=$(git rev-list --count upstream/main)
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "commit_count=$commit_count" >> $GITHUB_OUTPUT
            last_session_date="never"
          fi
          
          echo "last_session_date=$last_session_date" >> $GITHUB_OUTPUT

      - name: Create analysis branch
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "🌿 Creating analysis branch: ${{ steps.session-info.outputs.branch_name }}"
          
          # Create branch from latest upstream
          git checkout -b "${{ steps.session-info.outputs.branch_name }}" upstream/main
          
          # Push the new branch
          git push origin "${{ steps.session-info.outputs.branch_name }}"
          
          echo "✅ Analysis branch created and pushed"

      - name: Setup Node.js for session tools
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '.github/upstream-analysis/package.json'

      - name: Install analysis dependencies
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "📦 Installing analysis dependencies..."
          cd .github/upstream-analysis
          npm ci

      - name: Generate analysis document
        if: steps.changes.outputs.has_changes == 'true'
        env:
          SESSION_ID: ${{ steps.session-info.outputs.session_id }}
          SESSION_DATE: ${{ steps.session-info.outputs.session_date }}
          SESSION_TYPE: ${{ steps.session-info.outputs.session_type }}
          FOCUS_AREA: ${{ steps.session-info.outputs.focus_area }}
          PARTICIPANTS: ${{ steps.session-info.outputs.participants }}
          COMMIT_COUNT: ${{ steps.changes.outputs.commit_count }}
          LAST_SESSION_DATE: ${{ steps.changes.outputs.last_session_date }}
        run: |
          echo "📝 Generating pre-populated analysis document..."
          cd .github/upstream-analysis
          
          # Generate the analysis session document
          node generate-template.js session \
            --session-id="$SESSION_ID" \
            --session-date="$SESSION_DATE" \
            --session-type="$SESSION_TYPE" \
            --focus-area="$FOCUS_AREA" \
            --participants="$PARTICIPANTS" \
            --commit-count="$COMMIT_COUNT" \
            --last-session="$LAST_SESSION_DATE" \
            --output="../analysis-sessions/"
          
          echo "✅ Analysis document generated"

      - name: Collect and visualize changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "📊 Collecting and visualizing upstream changes..."
          cd .github/upstream-analysis
          
          # Use existing analysis tools to generate change summary
          if [ "${{ steps.changes.outputs.last_session_date }}" != "never" ]; then
            # Get commit range from last session
            last_commit=$(git rev-parse "origin/analysis/${{ steps.changes.outputs.last_session_date }}-*" 2>/dev/null | head -1 || echo "")
            if [ -n "$last_commit" ]; then
              from_ref="$last_commit"
            else
              from_ref="upstream/main~${{ steps.changes.outputs.commit_count }}"
            fi
          else
            from_ref="upstream/main~${{ steps.changes.outputs.commit_count }}"
          fi
          
          to_ref="upstream/main"
          
          echo "📍 Analyzing range: $from_ref → $to_ref"
          
          # Generate change analysis and classification
          node analyze-changes.js "$from_ref" "$to_ref" --session-prep
          
          # Run classification on the changes
          node classify-changes.js "$from_ref" "$to_ref" --session-format
          
          echo "✅ Change analysis completed"

      - name: Commit session preparation artifacts
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "💾 Committing session preparation artifacts..."
          
          # Switch to the analysis branch
          git checkout "${{ steps.session-info.outputs.branch_name }}"
          
          # Add generated files
          git add .github/analysis-sessions/ .github/upstream-analysis/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "ℹ️ No new artifacts to commit"
          else
            git commit -m "feat: prepare analysis session ${{ steps.session-info.outputs.session_id }}

            - Generated pre-populated analysis document
            - Collected upstream changes since last session (${{ steps.changes.outputs.last_session_date }})
            - Analyzed ${{ steps.changes.outputs.commit_count }} new commits
            - Created change summaries and visualizations
            - Session type: ${{ steps.session-info.outputs.session_type }}
            - Focus area: ${{ steps.session-info.outputs.focus_area }}
            
            🤖 Generated with Analysis Session Automation
            Co-Authored-By: analysis-bot[bot] <analysis-bot[bot]@users.noreply.github.com>"
            
            git push origin "${{ steps.session-info.outputs.branch_name }}"
            echo "✅ Session artifacts committed and pushed"
          fi

      - name: Create session summary
        if: always()
        run: |
          echo "📊 Analysis Session Preparation Summary" >> $GITHUB_STEP_SUMMARY
          echo "=======================================" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
            echo "✅ **Session Prepared Successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📋 Session Details" >> $GITHUB_STEP_SUMMARY
            echo "- **Session ID**: \`${{ steps.session-info.outputs.session_id }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Date**: ${{ steps.session-info.outputs.session_date }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Type**: ${{ steps.session-info.outputs.session_type }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Focus Area**: ${{ steps.session-info.outputs.focus_area }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch**: \`${{ steps.session-info.outputs.branch_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📊 Changes Analysis" >> $GITHUB_STEP_SUMMARY
            echo "- **New Commits**: ${{ steps.changes.outputs.commit_count }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Since**: ${{ steps.changes.outputs.last_session_date }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🎯 Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "1. Review the generated analysis document in the \`${{ steps.session-info.outputs.branch_name }}\` branch" >> $GITHUB_STEP_SUMMARY
            echo "2. Schedule the analysis session with participants: ${{ steps.session-info.outputs.participants }}" >> $GITHUB_STEP_SUMMARY
            echo "3. Use the interactive CLI tools during the session" >> $GITHUB_STEP_SUMMARY
            echo "4. Complete post-session processing" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **No New Changes Detected**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No upstream changes found since the last analysis session (${{ steps.changes.outputs.last_session_date }})." >> $GITHUB_STEP_SUMMARY
            echo "The analysis session has been skipped." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Session preparation completed at $(date -u)*" >> $GITHUB_STEP_SUMMARY

  schedule-calendar-event:
    name: "📅 Schedule Calendar Event"
    runs-on: ubuntu-latest
    needs: prepare-session
    if: needs.prepare-session.outputs.has_changes == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Schedule calendar event
        env:
          GOOGLE_CALENDAR_CREDENTIALS: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          SESSION_ID: ${{ needs.prepare-session.outputs.session_id }}
          SESSION_DATE: ${{ needs.prepare-session.outputs.session_date }}
          SESSION_TYPE: ${{ needs.prepare-session.outputs.session_type }}
          PARTICIPANTS: ${{ needs.prepare-session.outputs.participants }}
          FOCUS_AREA: ${{ needs.prepare-session.outputs.focus_area }}
          DURATION: ${{ inputs.duration_minutes || '60' }}
        run: |
          echo "📅 Creating calendar event for analysis session..."
          
          # Note: Calendar integration implementation would go here
          # For now, we'll create a placeholder that logs the event details
          echo "📋 Calendar Event Details:"
          echo "- Title: Upstream Analysis Session ($SESSION_TYPE)"
          echo "- Date: $SESSION_DATE"
          echo "- Duration: ${DURATION} minutes"
          echo "- Participants: $PARTICIPANTS"
          echo "- Focus: $FOCUS_AREA"
          echo "- Session ID: $SESSION_ID"
          
          # TODO: Implement actual Google Calendar API integration
          # This would require:
          # 1. Google Calendar API credentials
          # 2. Calendar ID
          # 3. Node.js script to create the event
          
          echo "⚠️ Calendar integration not yet implemented"
          echo "📝 Manual calendar event creation required"

  notify-team:
    name: "📢 Notify Team"
    runs-on: ubuntu-latest
    needs: [prepare-session, schedule-calendar-event]
    if: needs.prepare-session.outputs.has_changes == 'true'
    
    steps:
      - name: Create notification summary
        run: |
          echo "📢 Sending session notification..."
          
          # Note: Team notification implementation would go here
          # This could integrate with:
          # - Slack webhooks
          # - Email notifications
          # - Microsoft Teams
          # - GitHub Issues
          
          echo "📋 Notification Details:"
          echo "- Recipients: ${{ needs.prepare-session.outputs.participants }}"
          echo "- Session: ${{ needs.prepare-session.outputs.session_id }}"
          echo "- Branch: ${{ needs.prepare-session.outputs.branch_name }}"
          echo "- Changes: ${{ needs.prepare-session.outputs.commit_count }} commits"
          
          echo "⚠️ Team notification not yet implemented"
          echo "📝 Manual team notification required"