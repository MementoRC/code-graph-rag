name: Build and Deploy Documentation

on:
  push:
    branches: [ main, feat-upstream-analysis-strategy ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force complete rebuild'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "docs-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🛒 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: docs/package-lock.json
        
    - name: 📦 Install dependencies
      working-directory: docs
      run: |
        npm ci
        
    - name: 🧪 Run tests
      working-directory: docs
      run: |
        npm run typecheck
        npm run lint
        echo "✅ Documentation tests passed"
        
    - name: 🔍 Generate diagrams
      working-directory: docs
      run: |
        # Generate Mermaid diagrams if available
        if command -v mmdc &> /dev/null; then
          npm run build-diagrams || echo "⚠️ Diagram generation skipped"
        else
          echo "ℹ️ Mermaid CLI not available, skipping diagram generation"
        fi
        
    - name: 🏗️ Build documentation
      working-directory: docs
      env:
        NODE_ENV: production
      run: |
        echo "🏗️ Building documentation..."
        npm run build
        echo "✅ Documentation build completed"
        
        # List generated files
        echo "📁 Generated files:"
        find build -name "*.html" | head -10
        
    - name: 📤 Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/build
        
  deploy:
    # Only deploy on main branch pushes
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat-upstream-analysis-strategy'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: 🚀 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      
    - name: 📊 Deployment Summary
      run: |
        echo "## 🎉 Documentation Deployment Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Documentation URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
        echo "**Deployment Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "**Type:** Manual deployment" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            echo "**Mode:** Force rebuild enabled" >> $GITHUB_STEP_SUMMARY
          fi
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "**Type:** PR preview build" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** #${{ github.event.number }}" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📚 Documentation Features" >> $GITHUB_STEP_SUMMARY
        echo "- **Getting Started Guide:** Complete setup and first steps" >> $GITHUB_STEP_SUMMARY
        echo "- **User Documentation:** Comprehensive usage guides" >> $GITHUB_STEP_SUMMARY
        echo "- **Training Materials:** Interactive tutorials and exercises" >> $GITHUB_STEP_SUMMARY
        echo "- **API Reference:** Complete technical reference" >> $GITHUB_STEP_SUMMARY
        echo "- **Architecture Diagrams:** System design and data flow" >> $GITHUB_STEP_SUMMARY
        echo "- **Troubleshooting:** Common issues and solutions" >> $GITHUB_STEP_SUMMARY
        echo "- **Video Tutorials:** Visual learning resources" >> $GITHUB_STEP_SUMMARY
        echo "- **Search Functionality:** Full-text search across all docs" >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🎯 Quick Links" >> $GITHUB_STEP_SUMMARY
        echo "- [📖 Full Documentation](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY
        echo "- [🚀 Quick Start Tutorial](${{ steps.deployment.outputs.page_url }}training/quick-start/overview)" >> $GITHUB_STEP_SUMMARY
        echo "- [📊 Dashboard Guide](${{ steps.deployment.outputs.page_url }}docs/user-guide/dashboard)" >> $GITHUB_STEP_SUMMARY
        echo "- [🔧 API Reference](${{ steps.deployment.outputs.page_url }}reference/api/overview)" >> $GITHUB_STEP_SUMMARY

  # Build check for PRs (build only, no deploy)
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
    - name: 🛒 Checkout repository
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: docs/package-lock.json
        
    - name: 📦 Install dependencies
      working-directory: docs
      run: npm ci
      
    - name: 🧪 Run tests
      working-directory: docs
      run: |
        npm run typecheck
        npm run lint
        
    - name: 🏗️ Build documentation
      working-directory: docs
      run: npm run build
      
    - name: ✅ PR Check Summary
      run: |
        echo "## ✅ Documentation Build Check Passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**PR:** #${{ github.event.number }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.head_ref }}" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** Ready for merge" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Checks Completed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ TypeScript type checking" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ ESLint code quality" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Docusaurus build" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Asset generation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "*Documentation will be deployed automatically when this PR is merged to main.*"