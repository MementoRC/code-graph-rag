name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, development]

env:
  PYTHONUNBUFFERED: 1
  PIXI_VERSION: v0.49.0  # Stable version - prevents installation failures
  ENVIRONMENT: ci
  CLAUDECODE: 0

jobs:
  changes:
    name: "📋 Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.changes.outputs.python }}
      tests: ${{ steps.changes.outputs.tests }}
      docs: ${{ steps.changes.outputs.docs }}
      ci: ${{ steps.changes.outputs.ci }}
      skip: ${{ steps.changes.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            python:
              - 'codebase_rag/**/*.py'
              - 'pyproject.toml'
              - 'pixi.lock'
            tests:
              - 'codebase_rag/tests/**'
              - 'pytest.ini'
            docs:
              - 'docs/**'
              - 'README.md'
              - '*.md'
            ci:
              - '.github/workflows/**'
              - 'pyproject.toml'
            skip:
              - 'docs/**'
              - '*.md'
              - '.gitignore'
              - 'LICENSE'

  fast-quality-check:
    name: "⚡ Fast Quality Check"
    runs-on: ubuntu-latest
    needs: changes
    if: >
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enhanced pixi installation for PR checks with comprehensive fallbacks
        run: |
          echo "🚀 Installing pixi for PR quality checks with enhanced reliability"
          
          # Enhanced logging function
          log_status() {
            local level="$1"
            local message="$2"
            echo "[$level] $(date -u '+%Y-%m-%d %H:%M:%S UTC') [PR-CHECK] - $message"
          }
          
          # Enhanced pixi verification
          verify_pixi() {
            if command -v pixi >/dev/null 2>&1; then
              local pixi_version=$(pixi --version 2>/dev/null || echo "version unknown")
              log_status "SUCCESS" "pixi installed: $pixi_version"
              # Test basic functionality
              if pixi --help >/dev/null 2>&1; then
                return 0
              else
                log_status "ERROR" "pixi found but not functional"
                return 1
              fi
            else
              log_status "ERROR" "pixi not found in PATH"
              return 1
            fi
          }
          
          # Retry mechanism for installation
          install_with_retry() {
            local attempts=3
            local delay=2
            
            for attempt in $(seq 1 $attempts); do
              log_status "INFO" "Installation attempt $attempt/$attempts"
              
              if curl -fsSL --connect-timeout 30 --retry 3 https://pixi.sh/install.sh | bash -s -- --version ${{ env.PIXI_VERSION }}; then
                echo "$HOME/.pixi/bin" >> $GITHUB_PATH
                export PATH="$HOME/.pixi/bin:$PATH"
                
                if verify_pixi; then
                  log_status "SUCCESS" "Installation successful on attempt $attempt"
                  return 0
                fi
              fi
              
              if [ $attempt -lt $attempts ]; then
                log_status "WARN" "Attempt $attempt failed, retrying in ${delay}s"
                sleep $delay
                delay=$((delay * 2))
              fi
            done
            
            return 1
          }
          
          # Manual download fallback
          manual_install() {
            log_status "INFO" "Attempting manual download installation"
            
            local version_clean=$(echo ${{ env.PIXI_VERSION }} | sed 's/^v//')
            local download_url="https://github.com/prefix-dev/pixi/releases/download/${{ env.PIXI_VERSION }}/pixi-x86_64-unknown-linux-musl"
            
            mkdir -p "$HOME/.pixi/bin"
            
            if curl -fsSL --connect-timeout 30 --retry 3 -o "$HOME/.pixi/bin/pixi" "$download_url"; then
              chmod +x "$HOME/.pixi/bin/pixi"
              echo "$HOME/.pixi/bin" >> $GITHUB_PATH
              export PATH="$HOME/.pixi/bin:$PATH"
              
              if verify_pixi; then
                log_status "SUCCESS" "Manual installation successful"
                return 0
              fi
            fi
            
            return 1
          }
          
          # Execute installation with fallbacks
          log_status "INFO" "Starting enhanced pixi installation for PR checks"
          
          if install_with_retry; then
            log_status "SUCCESS" "Standard installation completed"
          elif manual_install; then
            log_status "SUCCESS" "Manual installation completed"
          else
            log_status "ERROR" "All installation methods failed"
            echo "Debug information:"
            echo "- PATH: $PATH"
            echo "- Network test: $(curl -Is --connect-timeout 5 https://github.com | head -1 || echo 'Network failed')"
            echo "- Files in .pixi: $(ls -la $HOME/.pixi/ 2>/dev/null || echo 'No .pixi directory')"
            exit 1
          fi

      - name: Enhanced quality tools installation with fallbacks
        run: |
          echo "🔧 Installing quality tools with enhanced reliability"
          
          # Enhanced installation with fallbacks
          if pixi install -e ci; then
            echo "✅ CI environment installed successfully"
          elif pixi install -e dev; then
            echo "⚠️ Using dev environment as fallback"
          elif pixi install; then
            echo "⚠️ Using default environment as last resort"
          else
            echo "🚨 CRITICAL: All environment installations failed"
            echo "Project info:"
            pixi info 2>&1 || echo "pixi info failed"
            exit 1
          fi

      - name: Run fast lint check (F,E9 only)
        run: |
          echo "🚨 Running critical lint checks"
          pixi run -e ci lint

      - name: Check code formatting
        run: |
          echo "🎨 Checking code formatting"
          pixi run -e ci format-check

      - name: Run type checking
        run: |
          echo "📝 Running type checks"
          pixi run -e ci typecheck

      - name: Post quick status
        if: always()
        run: |
          echo "## ⚡ Fast Quality Check Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          # Lint check
          if pixi run -e ci lint --quiet >/dev/null 2>&1; then
            echo "| Critical Lint (F,E9) | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Critical Lint (F,E9) | ❌ FAIL |" >> $GITHUB_STEP_SUMMARY
          fi

          # Format check
          if pixi run -e ci format-check --quiet >/dev/null 2>&1; then
            echo "| Code Formatting | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Code Formatting | ❌ FAIL |" >> $GITHUB_STEP_SUMMARY
          fi

          # Type check
          if pixi run -e ci typecheck --quiet >/dev/null 2>&1; then
            echo "| Type Checking | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Type Checking | ❌ FAIL |" >> $GITHUB_STEP_SUMMARY
          fi

  quick-tests:
    name: "🧪 Quick Tests"
    runs-on: ubuntu-latest
    needs: [changes, fast-quality-check]
    if: >
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enhanced pixi installation for tests with reliability improvements
        run: |
          echo "🚀 Installing pixi for quick tests with enhanced reliability"
          
          # Reuse the enhanced installation logic
          install_with_retry() {
            local attempts=3
            for attempt in $(seq 1 $attempts); do
              if curl -fsSL --connect-timeout 30 --retry 3 https://pixi.sh/install.sh | bash -s -- --version ${{ env.PIXI_VERSION }}; then
                echo "$HOME/.pixi/bin" >> $GITHUB_PATH
                export PATH="$HOME/.pixi/bin:$PATH"
                
                if command -v pixi >/dev/null 2>&1 && pixi --help >/dev/null 2>&1; then
                  echo "✅ pixi installed successfully: $(pixi --version)"
                  return 0
                fi
              fi
              
              if [ $attempt -lt $attempts ]; then
                echo "⚠️ Attempt $attempt failed, retrying..."
                sleep 2
              fi
            done
            return 1
          }
          
          if ! install_with_retry; then
            echo "🚨 CRITICAL: pixi installation failed after retries"
            exit 1
          fi

      - name: Install test dependencies with validation
        run: |
          echo "🧪 Installing test dependencies"
          if pixi install -e ci; then
            echo "✅ Test dependencies installed successfully"
          else
            echo "🚨 CRITICAL: Failed to install test dependencies"
            exit 1
          fi

      - name: Run unit tests only (fast)
        run: |
          echo "🧪 Running unit tests"
          pixi run -e ci test-unit ||
            echo "⚠️ Some unit tests failed"

      - name: Generate test summary
        if: always()
        run: |
          echo "## 🧪 Quick Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Note**: Full test suite runs in main CI pipeline" |
            >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enhanced pixi installation for security with retry mechanisms
        run: |
          echo "🚀 Installing pixi for security scanning with enhanced reliability"
          
          # Enhanced installation with retry
          install_with_retry() {
            local attempts=3
            for attempt in $(seq 1 $attempts); do
              if curl -fsSL --connect-timeout 30 --retry 3 https://pixi.sh/install.sh | bash -s -- --version ${{ env.PIXI_VERSION }}; then
                echo "$HOME/.pixi/bin" >> $GITHUB_PATH
                export PATH="$HOME/.pixi/bin:$PATH"
                
                if command -v pixi >/dev/null 2>&1 && pixi --help >/dev/null 2>&1; then
                  echo "✅ pixi installed successfully: $(pixi --version)"
                  return 0
                fi
              fi
              
              if [ $attempt -lt $attempts ]; then
                echo "⚠️ Attempt $attempt failed, retrying..."
                sleep 2
              fi
            done
            return 1
          }
          
          if ! install_with_retry; then
            echo "🚨 CRITICAL: pixi installation failed after retries"
            exit 1
          fi

      - name: Install security tools with validation
        run: |
          echo "🔒 Installing security tools"
          if pixi install -e ci; then
            echo "✅ Security tools installed successfully"
          else
            echo "🚨 CRITICAL: Failed to install security tools"
            exit 1
          fi

      - name: Run Bandit security scan
        run: |
          echo "🔒 Running security analysis"
          pixi run -e ci security-scan

      - name: Security summary
        if: always()
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- Bandit security analysis completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Note**: Full vulnerability scan runs in main CI pipeline" >> $GITHUB_STEP_SUMMARY

  pr-size-check:
    name: "📏 PR Size Check"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          # Get base branch for comparison
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"

          # Count changes
          ADDED_LINES=$(git diff --numstat origin/$BASE_BRANCH...HEAD | awk '{sum += $1} END {print sum+0}')
          REMOVED_LINES=$(git diff --numstat origin/$BASE_BRANCH...HEAD | awk '{sum += $2} END {print sum+0}')
          CHANGED_FILES=$(git diff --name-only origin/$BASE_BRANCH...HEAD | wc -l)

          echo "## 📏 PR Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Files Changed | $CHANGED_FILES |" >> $GITHUB_STEP_SUMMARY
          echo "| Lines Added | $ADDED_LINES |" >> $GITHUB_STEP_SUMMARY
          echo "| Lines Removed | $REMOVED_LINES |" >> $GITHUB_STEP_SUMMARY

          # Size recommendations
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💡 PR Size Recommendations" >> $GITHUB_STEP_SUMMARY
          if [ $CHANGED_FILES -gt 20 ]; then
            echo "- ⚠️ Consider splitting into smaller PRs (20+ files changed)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ $ADDED_LINES -gt 500 ]; then
            echo "- ⚠️ Large PR - consider breaking into smaller changes (500+ lines added)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ $CHANGED_FILES -le 10 ] && [ $ADDED_LINES -le 200 ]; then
            echo "- ✅ Good PR size for easy review" >> $GITHUB_STEP_SUMMARY
          fi

  pr-description-check:
    name: "📝 PR Description Check"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR description
        run: |
          # Use jq to safely extract PR data from GitHub event
          PR_BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          PR_TITLE=$(jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH")

          echo "## 📝 PR Quality Check" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          # Check title format
          if [[ "$PR_TITLE" =~ ^(feat|fix|docs|refactor|perf|test|chore|ci): ]]; then
            echo "| Title Format | ✅ Conventional commits format |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Title Format | ⚠️ Consider using conventional commits format |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check description length
          if [ ${#PR_BODY} -gt 50 ]; then
            echo "| Description | ✅ Detailed description provided |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Description | ⚠️ Consider adding more details |" >> $GITHUB_STEP_SUMMARY
          fi

  documentation-check:
    name: "📚 Documentation Check"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' && needs.changes.outputs.docs == 'false'
    steps:
      - name: Check for documentation updates
        run: |
          echo "## 📚 Documentation Update Reminder" >> $GITHUB_STEP_SUMMARY
          echo "This PR modifies Python code but doesn't update documentation." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Consider updating:" >> $GITHUB_STEP_SUMMARY
          echo "- README.md if adding new features" >> $GITHUB_STEP_SUMMARY
          echo "- API documentation for new functions/classes" >> $GITHUB_STEP_SUMMARY
          echo "- Usage examples if behavior changes" >> $GITHUB_STEP_SUMMARY

  pr-summary:
    name: "📊 PR Summary"
    runs-on: ubuntu-latest
    needs: [changes, fast-quality-check, quick-tests, security-scan]
    if: always()
    steps:
      - name: Generate PR summary
        run: |
          echo "# 🚀 PR Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Change detection summary
          echo "## 📋 Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "- Python code: ${{ needs.changes.outputs.python == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.changes.outputs.tests == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation: ${{ needs.changes.outputs.docs == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- CI/CD: ${{ needs.changes.outputs.ci == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Quality check results
          echo "## 🎯 Quality Check Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Fast Quality | ${{ needs.fast-quality-check.result == 'success' && '✅ PASS' || needs.fast-quality-check.result == 'skipped' && '⏭️ SKIP' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quick Tests | ${{ needs.quick-tests.result == 'success' && '✅ PASS' || needs.quick-tests.result == 'skipped' && '⏭️ SKIP' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅ PASS' || needs.security-scan.result == 'skipped' && '⏭️ SKIP' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Next steps
          echo "## 🎯 Next Steps" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.fast-quality-check.result }}" == "failure" ]]; then
            echo "- ❌ **Fix quality issues** before requesting review" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.quick-tests.result }}" == "failure" ]]; then
            echo "- 🧪 **Fix failing tests** before proceeding" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ **Ready for review** - all quick checks passed" >> $GITHUB_STEP_SUMMARY
            echo "- 🔄 Full CI pipeline will run after approval" >> $GITHUB_STEP_SUMMARY
          fi