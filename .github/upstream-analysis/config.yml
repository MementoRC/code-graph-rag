---
# Upstream Analysis Configuration
# Controls change detection and notification behavior

# Change Detection Settings
detection:
  # Minimum number of commits to trigger analysis
  min_commits: 1
  
  # Maximum commits to analyze in one batch (performance limit)
  max_commits: 100
  
  # Days to look back for analysis context
  analysis_window_days: 30

# Significance Rules - determines what changes are important
significance:
  # File patterns that indicate significant changes
  significant_files:
    - "*.py"          # Python source files
    - "*.js"          # JavaScript files
    - "*.ts"          # TypeScript files
    - "*.rs"          # Rust files
    - "*.go"          # Go files
    - "*.yml"         # Configuration files
    - "*.yaml"        # Configuration files
    - "*.json"        # Data/config files
    - "pyproject.toml" # Python project config
    - "package.json"  # Node.js project config
    - "Cargo.toml"    # Rust project config
    - "go.mod"        # Go module config
    - "Dockerfile"    # Docker configuration
    - "docker-compose.yml" # Docker compose
    - "README.md"     # Documentation
    - "CHANGELOG.md"  # Change documentation
  
  # File patterns to ignore (low significance)
  ignore_files:
    - "*.log"         # Log files
    - "*.tmp"         # Temporary files
    - "*.cache"       # Cache files
    - "*.lock"        # Lock files (some exceptions in significant_files)
    - ".gitignore"    # Git ignore (unless major changes)
    - "*.md"          # Most markdown (README is exception above)
    - "docs/**"       # Documentation directory
    - "examples/**"   # Example files
  
  # Commit message keywords that indicate significance
  significant_keywords:
    - "breaking"      # Breaking changes
    - "BREAKING"      # Breaking changes (caps)
    - "feat"          # New features
    - "feature"       # New features
    - "fix"           # Bug fixes
    - "security"      # Security updates
    - "performance"   # Performance improvements
    - "perf"          # Performance improvements
    - "refactor"      # Code refactoring
    - "api"           # API changes
    - "database"      # Database changes
    - "migration"     # Migration scripts
    - "config"        # Configuration changes
  
  # Keywords that reduce significance
  low_significance_keywords:
    - "docs"          # Documentation only
    - "typo"          # Typo fixes
    - "style"         # Code style changes
    - "format"        # Formatting changes
    - "whitespace"    # Whitespace changes
    - "comment"       # Comment changes
    - "test"          # Test-only changes (unless breaking test changes)

# Change Categorization
categories:
  feature:
    keywords: ["feat", "feature", "add", "new"]
    weight: 8
    color: "#28a745"  # Green
  
  bugfix:
    keywords: ["fix", "bug", "patch", "resolve"]
    weight: 7
    color: "#dc3545"  # Red
  
  security:
    keywords: ["security", "vulnerability", "cve"]
    weight: 10
    color: "#fd7e14"  # Orange
  
  performance:
    keywords: ["perf", "performance", "optimize", "speed"]
    weight: 6
    color: "#17a2b8"  # Info blue
  
  breaking:
    keywords: ["breaking", "BREAKING"]
    weight: 10
    color: "#6f42c1"  # Purple
  
  refactor:
    keywords: ["refactor", "restructure", "reorganize"]
    weight: 5
    color: "#6c757d"  # Gray
  
  config:
    keywords: ["config", "configuration", "settings"]
    weight: 4
    color: "#ffc107"  # Yellow
  
  docs:
    keywords: ["docs", "documentation", "readme"]
    weight: 2
    color: "#20c997"  # Teal
  
  test:
    keywords: ["test", "testing", "spec"]
    weight: 3
    color: "#e83e8c"  # Pink

# Notification Channels
notifications:
  # GitHub Issues
  github_issues:
    enabled: true
    # Create issue for changes above this significance score
    min_significance_score: 15
    # Labels to add to created issues
    labels:
      - "upstream-sync"
      - "analysis-required"
    # Issue title template
    title_template: "Upstream Analysis: {commit_count} commits ({date})"
    # Assignees for created issues (GitHub usernames)
    assignees: []
  
  # Slack Notifications
  slack:
    enabled: false  # Set to true and configure webhook_url to enable
    webhook_url: ""  # Set via environment variable SLACK_WEBHOOK_URL
    # Send notification for changes above this score
    min_significance_score: 10
    # Channel to post to (override webhook default)
    channel: "#upstream-analysis"
    # Username for bot posts
    username: "Upstream Sync Bot"
    # Icon emoji for posts
    icon_emoji: ":arrow_up:"
  
  # Email Notifications
  email:
    enabled: false  # Set to true and configure SMTP settings to enable
    # SMTP settings (configure via environment variables)
    # EMAIL_HOST, EMAIL_PORT, EMAIL_USER, EMAIL_PASSWORD
    recipients: []
    # Send summary for changes above this score
    min_significance_score: 20
    # Email subject template
    subject_template: "Upstream Sync Summary: {date}"

# Analysis Thresholds
thresholds:
  # Total significance score that triggers notifications
  notification_threshold: 10
  
  # Score above which changes are considered "major"
  major_change_threshold: 25
  
  # Score above which changes are considered "critical"
  critical_change_threshold: 50
  
  # Maximum files to include in detailed analysis
  max_files_detail: 20
  
  # Maximum commits to show in notifications
  max_commits_summary: 10

# Performance Settings
performance:
  # Timeout for GitHub API calls (seconds)
  api_timeout: 30
  
  # Delay between API calls to avoid rate limiting (ms)
  api_delay: 100
  
  # Maximum file size to include in diff analysis (bytes)
  max_file_size: 1048576  # 1MB